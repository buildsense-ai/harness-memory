<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Harness Memory · 工作台</title><link rel="stylesheet" href="/workbench.css"><style>.task-card.focused{outline:2px solid #168c6a;outline-offset:2px}.memory-node.episode-node{background:#f0f3f1;border-color:#d5dfda;color:#53645f}.memory-node.episode-node:hover{background:#e7ece9}</style></head>
<body><header class="topbar"><a class="brand" href="/workbench"><span class="brand-mark">HM</span><span>Harness Memory<small>记忆工作台</small></span></a><div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-label">未连接</span></div><form id="key-form" class="key-form"><label for="project-key">项目 Key</label><input id="project-key" type="password" autocomplete="off" spellcheck="false" placeholder="hm_..." aria-label="项目 API Key"><button class="button button-dark" type="submit">连接</button><button class="icon-button" id="disconnect" type="button" title="断开连接" aria-label="断开连接">×</button></form></header>
<main><section class="searchbar"><div class="search-title"><span class="eyebrow">记忆检索</span><span id="scope-label">连接项目后可搜索全部已发布记忆</span></div><form id="search-form" class="search-controls"><input id="keywords" placeholder="输入关键词，以空格分隔" aria-label="记忆搜索关键词"><select id="operator" aria-label="关键词匹配方式"><option value="AND">全部匹配</option><option value="OR">任一匹配</option></select><button class="button button-accent" type="submit">⌕ 搜索</button></form></section>
<section class="workspace"><aside class="rail"><div class="panel-heading"><div><span class="eyebrow">来源</span><h1>上传记录</h1></div><button class="icon-button" id="refresh" type="button" title="刷新上传记录" aria-label="刷新上传记录">↻</button></div><div class="list-meta" id="stream-meta">等待连接</div><div id="streams" class="stream-list"><div class="empty-state">连接项目 Key 后读取真实上传记录。</div></div><div class="rail-divider"></div><div class="panel-heading compact"><div><span class="eyebrow">处理</span><h2>处理批次</h2></div></div><div id="runs" class="run-list"><div class="empty-state small">选择一个日志流</div></div><button id="more-runs" class="text-button hidden" type="button">加载更多批次</button></aside>
<section class="map-panel"><div class="panel-heading map-heading"><div><span class="eyebrow">来源路径</span><h1 id="map-title">选择一个处理批次</h1></div><div class="map-legend"><span><i class="legend-source"></i>原文快照</span><span><i class="legend-task"></i>任务</span><span><i class="legend-memory"></i>记忆</span></div></div><div id="run-summary" class="run-summary hidden"></div><div id="graph" class="graph"><div class="welcome-map"><div class="welcome-icon">↗</div><p>从左侧选择一次处理，查看原文如何成为可检索记忆。</p><span>所有连接都由服务器保存的 ID 确定</span></div></div></section>
<aside class="inspector"><div class="panel-heading"><div><span class="eyebrow">检查</span><h1 id="inspector-title">内容检查</h1></div><span id="inspector-kind" class="kind-label">待选择</span></div><div id="inspector" class="inspector-body"><div class="empty-state">点击图中的任务、Episode 或记忆，查看对应内容。</div></div></aside></section>
<div id="notice" class="notice" role="status" aria-live="polite"></div></main><script src="/workbench.js" defer></script></body></html>
