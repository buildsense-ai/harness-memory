<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory · 三层工作台</title><link rel="stylesheet" href="/workbench.css"></head>
<body>
<header class="appbar"><a class="brand" href="#">Memory<span class="brand-separator">/</span><span class="brand-detail">工作台</span></a><form id="search-form"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor"/><path d="m13 13 4 4" stroke="currentColor"/></svg><input id="search" aria-label="搜索已发布记忆，空格分隔关键词" placeholder="搜索记忆"><select id="search-operator" aria-label="关键词匹配方式"><option>AND</option><option>OR</option></select><button type="submit">查找</button></form><button id="connection-button">连接</button><button id="refresh" disabled>刷新</button></header>
<main class="layout">
<aside class="sidebar"><div class="sidebar-top">会话<span id="session-count">0</span></div><div id="sessions"></div><button id="more-sessions" hidden>更多会话</button><button id="more-runs" hidden>更多批次</button><div id="search-results" aria-live="polite"></div><div class="sidebar-bottom"><div><i class="legend-dot blue"></i>Wiki</div><div><i class="legend-dot green"></i>选定上下文</div><div><i class="legend-tick"></i>会话批次</div><p>同一会话的批次相邻排列<br>细线表示来源映射</p></div></aside>
<section class="graph-panel" aria-label="可旋转三维记忆图"><div class="graph-toolbar"><div><span id="map-status">来源图</span><span class="muted" id="sample-count">未连接</span></div><div class="graph-options"><label><input type="checkbox" id="show-labels">名称</label><label><input type="checkbox" id="show-links" checked>映射</label></div></div>
<div id="scene" class="scene"><canvas id="graph" tabindex="0" aria-label="三维图；拖拽旋转，滚轮缩放。也可使用左侧会话和下方节点列表。"></canvas><div id="labels" class="labels" aria-hidden="true"></div><div id="hover-tip" class="hover-tip"></div><div id="graph-error" class="graph-error" hidden>图形初始化失败。仍可通过会话和节点列表阅读内容。</div><div class="graph-instructions">拖拽旋转 · 滚轮缩放 · 右键拖拽平移</div><div class="camera-controls"><button id="view-front">正面</button><button id="view-top">俯视</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button><button id="reset">复位</button></div></div>
<div class="graph-footer"><span id="selection-path"></span><span id="renderer-label">3D</span></div><details class="node-access"><summary>节点列表 <span>键盘可访问</span></summary><div id="node-list"></div></details></section>
<aside class="reader"><div class="reader-header"><div><span id="reader-label">Wiki</span><h1 id="reader-title"></h1></div><span id="reader-id"></span></div><nav class="reader-tabs"><button data-view="wiki">Wiki</button><button data-view="context">选定上下文</button><button data-view="batch">会话批次</button></nav><div id="reader-meta" class="reader-meta"></div><div id="reader-content" class="reader-content" tabindex="0"></div><div class="reader-footer"><span id="reader-footnote">使用项目 Key 连接，读取已上传内容</span><button id="follow-source">查看原文 ↗</button></div></aside>
</main><dialog id="connection-dialog"><form id="connect-form"><h2>连接记忆服务</h2><p>仅能访问这个 Key 所属项目的数据。</p><label>项目 API Key<input id="project-key" type="password" autocomplete="off" required></label><p id="connection-error" role="alert"></p><div><button id="cancel-connect" type="button">取消</button><button type="submit">连接</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="/workbench.js"></script></body></html>
