<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Harness Memory · 工作台</title>
  <link rel="stylesheet" href="/workbench.css">
  <link rel="stylesheet" href="/workbench-overrides.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/workbench"><span class="brand-mark">HM</span><span>Harness Memory<small>Memory workbench</small></span></a>
    <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-label">未连接</span></div>
    <form id="key-form" class="key-form">
      <label for="project-key">项目 Key</label>
      <input id="project-key" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴项目 Key" aria-label="项目 API Key">
      <button class="button button-dark" type="submit">连接</button>
      <button class="icon-button" id="disconnect" type="button" title="断开连接" aria-label="断开连接">×</button>
    </form>
  </header>
  <main>
    <section class="toolbar">
      <div class="toolbar-title"><span class="eyebrow">记忆检索</span><span id="scope-label">连接项目后，可搜索该项目已发布的所有记忆</span></div>
      <form id="search-form" class="search-controls">
        <input id="keywords" placeholder="关键词，以空格分隔" aria-label="记忆搜索关键词">
        <select id="operator" aria-label="关键词匹配方式"><option value="AND">全部匹配</option><option value="OR">任一匹配</option></select>
        <button class="button button-accent" type="submit">搜索</button>
      </form>
    </section>
    <section class="workspace">
      <aside class="rail">
        <div class="panel-heading"><div><span class="eyebrow">上传来源</span><h1>日志流</h1></div><button class="icon-button" id="refresh" type="button" title="刷新日志流" aria-label="刷新日志流">↻</button></div>
        <div class="list-meta" id="stream-meta">等待连接</div>
        <div id="streams" class="stream-list"><div class="empty-state">连接项目 Key 后读取上传记录。</div></div>
        <div class="rail-divider"></div>
        <div class="panel-heading compact"><div><span class="eyebrow">处理记录</span><h2>处理批次</h2></div></div>
        <div id="runs" class="run-list"><div class="empty-state small">选择一个日志流</div></div>
        <button id="more-runs" class="text-button hidden" type="button">加载更多批次</button>
      </aside>
      <section class="main-column">
        <section class="graph-panel" aria-label="来源关系图">
          <div class="panel-heading graph-heading">
            <div><span class="eyebrow">来源关系</span><h1 id="map-title">选择一个处理批次</h1></div>
            <div class="map-legend"><span><i class="legend-source"></i>快照</span><span><i class="legend-task"></i>任务</span><span><i class="legend-episode"></i>Episode</span><span><i class="legend-memory"></i>记忆</span></div>
          </div>
          <div id="run-summary" class="run-summary hidden"></div>
          <div id="graph" class="graph"><div class="welcome-map"><div class="welcome-icon">◇</div><p>选择左侧处理批次，查看日志快照如何映射到任务、Episode 和记忆。</p></div></div>
        </section>
        <section class="detail-grid">
          <section class="detail-pane memory-pane">
            <div class="pane-heading"><div><span class="eyebrow">发布内容</span><h2 id="memory-heading">记忆文档</h2></div><span id="memory-kind" class="kind-label">待选择</span></div>
            <div id="memory-content" class="pane-content"><div class="empty-state">选择图中的记忆节点，查看完整 Markdown。</div></div>
          </section>
          <section class="detail-pane source-pane">
            <div class="pane-heading"><div><span class="eyebrow">原文依据</span><h2 id="source-heading">对应上下文</h2></div><span id="source-kind" class="kind-label">待选择</span></div>
            <div id="source-content" class="pane-content"><div class="empty-state">选择记忆或 Episode 节点，原始消息会显示在这里。</div></div>
          </section>
        </section>
      </section>
    </section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
  </main>
  <script src="/workbench.js" defer></script>
</body>
</html>
