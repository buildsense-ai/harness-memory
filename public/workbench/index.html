<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory · 工作台</title><link rel="stylesheet" href="/workbench.css"></head>
<body>
<header class="appbar"><a class="brand" href="#">Memory<span class="brand-separator">/</span><span class="brand-detail">工作台</span></a><form id="search-form"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor"/><path d="m13 13 4 4" stroke="currentColor"/></svg><input id="search" aria-label="搜索已发布记忆，空格分隔关键词" placeholder="搜索记忆"><select id="search-operator" aria-label="关键词匹配方式"><option>AND</option><option>OR</option></select><button type="submit">查找</button></form><button id="connection-button">连接</button><button id="refresh" disabled>刷新</button></header>
<main class="layout">
<aside class="sidebar">
<div class="filter-panel"><label>上传 Key<select id="upload-key-filter" aria-label="按上传 Key 筛选"><option value="">全部上传来源</option></select></label><div class="date-filter"><span>处理日期</span><div><input id="date-from" type="date" aria-label="处理开始日期"><span>至</span><input id="date-to" type="date" aria-label="处理结束日期"></div></div><button id="clear-filters" type="button">清除筛选</button></div>
<div class="sidebar-top">来源<span><span id="session-count">0</span> 个会话</span></div>
<button id="all-sources" class="all-sources active" type="button">全部记忆<span>↗</span></button>
<nav id="sessions" class="source-tree" aria-label="Bot、用户、会话和批次来源"></nav>
<div class="tree-pagination"><button id="more-sessions" hidden>更多会话</button><button id="more-runs" hidden>更多批次</button></div>
<div id="search-results" aria-live="polite"></div><div class="sidebar-bottom">Bot → 用户 → 会话 → 批次<br>点选任一层，在全图中高亮</div>
</aside>
<section class="graph-panel" aria-label="Wiki 记忆图">
<div class="graph-toolbar"><div class="graph-heading"><span id="map-status">全部记忆</span><span id="sample-count">未连接</span></div><div class="graph-options"><label><input type="checkbox" id="show-labels" checked>名称</label></div></div>
<div id="scene" class="scene"><canvas id="graph" tabindex="0" aria-label="Wiki 节点图；单击阅读并高亮左栏来源，双击滚动定位来源。"></canvas><div id="node-highlights" aria-hidden="true"></div><div id="labels" class="labels" aria-hidden="true"></div><div id="hover-tip" class="hover-tip"></div><div id="graph-empty" class="graph-empty">暂无 Wiki<span>可调整上传 Key、日期，或继续载入批次</span></div><div id="graph-error" class="graph-error" hidden>图形初始化失败，仍可通过下方节点列表阅读。</div><div id="graph-instructions" class="graph-instructions">拖拽平移 · 滚轮缩放 · 双击定位来源</div><div class="camera-controls"><button id="locate-source" disabled>定位来源</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button><button id="reset">复位</button></div></div>
<div class="graph-footer"><span id="selection-path"></span><span id="renderer-label">WebGL</span></div><div class="graph-disclaimer">蓝环：来源选中 · 金环：搜索命中 · 白环：当前 Wiki · 距离不代表语义关系</div><details class="node-access"><summary>Wiki 节点列表 <span>键盘可访问</span></summary><div id="node-list"></div></details>
</section>
<aside class="reader"><div class="reader-header"><div><span id="reader-label">Wiki</span><h1 id="reader-title"></h1></div><span id="reader-id"></span></div><nav class="reader-tabs"><button data-view="wiki">Wiki</button><button data-view="context">会话原文</button></nav><div id="reader-meta" class="reader-meta"></div><div id="reader-content" class="reader-content" tabindex="0"></div><div class="reader-footer"><span id="reader-footnote">使用项目 Key 连接记忆服务</span><button id="follow-source">查看原文 ↗</button></div></aside>
</main>
<dialog id="connection-dialog"><form id="connect-form"><h2>连接记忆服务</h2><p>仅能访问这个 Key 所属项目的数据。</p><label>项目 API Key<input id="project-key" type="password" autocomplete="off" required></label><p id="connection-error" role="alert"></p><div><button id="cancel-connect" type="button">取消</button><button type="submit">连接</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="/workbench.js"></script>
</body></html>
